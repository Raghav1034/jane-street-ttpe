name: gds
on:
  push:
  workflow_dispatch:
jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

      - name: Post-Build Read-Only PDN Diagnostics
        if: always()
        run: |
          echo "=== 1. SRAM LEF Power Pin Definitions (from downloaded PDK) ==="
          find /home/runner/.ciel -name "RM_IHPSG13_1P_512x32_c2_bm_bist.lef" 2>/dev/null | while read -r lef; do
            echo "LEF: $lef"
            awk '/PIN VDD/{flag=1} /PIN VSS/{flag=1} flag{print} /END VDD|END VSS/{flag=0}' "$lef" | head -n 80
          done || true
          echo "=== 2. GeneratePDN Log Excerpt ==="
          cat runs/wokwi/*-openroad-generatepdn/openroad-generatepdn.log 2>/dev/null | tail -n 80 || true
          echo "=== 3. IRDropReport Log Excerpt ==="
          cat runs/wokwi/*-openroad-irdropreport/openroad-irdropreport.log 2>/dev/null | head -n 60 || true
          echo "=== 4. All Executed LibreLane Steps & Final Signoff Status ==="
          ls -1d runs/wokwi/[0-9]* 2>/dev/null || true
          grep -rnE "ERROR| Critical" runs/wokwi/[5-9]*/*.log 2>/dev/null | tail -n 50 || true

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b