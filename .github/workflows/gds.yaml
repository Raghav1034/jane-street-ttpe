name: gds
on:
  push:
  workflow_dispatch:
jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

      - name: Post-Build Read-Only PDN Diagnostics
        if: always()
        run: |
          echo "=== 1. GeneratePDN Log Excerpt ==="
          cat runs/wokwi/*-openroad-generatepdn/openroad-generatepdn.log 2>/dev/null | tail -n 80 || true
          echo "=== 2. IRDropReport Log Excerpt ==="
          cat runs/wokwi/*-openroad-irdropreport/openroad-irdropreport.log 2>/dev/null | head -n 60 || true
          echo "=== 3. KLayout DRC Errors ==="
          cat runs/wokwi/*checker-klayoutdrc/checker-klayoutdrc.log 2>/dev/null || true

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
