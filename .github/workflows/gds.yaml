name: gds
on:
  push:
  workflow_dispatch:
jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Debug Inspect PDK LEF Pin Layers"
        run: |
          echo "=== Preview src/config.json ==="
          cat src/config.json
          echo "=== Top-level Port Declarations ==="
          grep -E "module tt_um|input|output|inout" src/tt_um_ttpe.sv | head -n 25
          echo "=== Search for SRAM LEF Pin Layers ==="
          find / -path "*/ihp-sg13g2*" -name 'RM_IHPSG13_1P_512x32_c2_bm_bist.lef' 2>/dev/null | while read f; do
            echo "Found: $f"
            grep -E "PIN VDD|PIN VDDARRAY|PIN VSS|LAYER" "$f" | head -n 30
          done || true

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b
