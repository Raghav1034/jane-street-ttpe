name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

      - name: Post-Build Signoff Summary
        if: always()
        run: |
          echo "=== 1. GeneratePDN & Bridge Summary ==="
          grep -E "ttpe pdn_cfg:|PDN-" runs/wokwi/*-openroad-generatepdn/openroad-generatepdn.log 2>/dev/null || true
          cat runs/wokwi/*-openroad-generatepdn/openroad-generatepdn.log 2>/dev/null | tail -n 60 || true
          echo "=== 2. PDN & IR-Drop Summary ==="
          grep -E "PSM-|Worstcase|Percentage drop" runs/wokwi/*-openroad-irdropreport/openroad-irdropreport.log 2>/dev/null || true
          echo "=== 3. KLayout DRC Summary ==="
          cat runs/wokwi/*checker-klayoutdrc/checker-klayoutdrc.log 2>/dev/null || true
          python3 -c "
          import glob, xml.etree.ElementTree as ET, collections
          for p in glob.glob('runs/wokwi/*klayout-drc*/*.lydrc') + glob.glob('runs/wokwi/*klayout-drc*/*.xml') + glob.glob('runs/wokwi/*klayout-drc*/reports/*.lyrdb'):
              print('Report:', p)
              tree = ET.parse(p)
              counts = collections.Counter(el.findtext('category') for el in tree.findall('.//item'))
              print('Total DRC items:', sum(counts.values()))
              for k, v in counts.most_common(15):
                  print(f'  {v:5d}x  {k}')
          " || true
          echo "=== 4. Final Executed Steps ==="
          ls -1d runs/wokwi/[0-9]* 2>/dev/null || true
          echo "=== 5. Untruncated STA (WNS/TNS/Slew/Cap) ==="
          cat runs/wokwi/*-openroad-stapostpnr/summary.rpt 2>/dev/null || true
          python3 -c "
          import glob, json
          for p in ['runs/wokwi/final/metrics.json'] + sorted(glob.glob('runs/wokwi/*-openroad-stapostpnr/state_out.json')):
              try:
                  d = json.load(open(p))
              except Exception:
                  continue
              m = d.get('metrics', d) if isinstance(d, dict) else {}
              print('--- Metrics from:', p, '---')
              for k in sorted(m):
                  if any(t in k for t in ('timing__', 'max_slew', 'max_cap', 'max_fanout', 'clock__skew')):
                      print(f'  {k}: {m[k]}')
              break
          " || true
          for c in runs/wokwi/*-openroad-stapostpnr/nom_*; do
            [ -d "$c" ] || continue
            echo "--- Corner: $(basename "$c") ---"
            for r in ws.max.rpt wns.max.rpt tns.max.rpt ws.min.rpt wns.min.rpt tns.min.rpt; do
              [ -f "$c/$r" ] && printf "  %-12s " "$r" && tr '\n' ' ' < "$c/$r" && echo
            done
            [ -f "$c/checks.rpt" ] && echo "  [checks.rpt report_check_types head -120]" && (sed -n '/report_check_types/,$p' "$c/checks.rpt" | head -n 120 || true)
          done || true

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
