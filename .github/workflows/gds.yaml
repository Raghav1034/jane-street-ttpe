name: gds
on:
  push:
  workflow_dispatch:
jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Debug and Patch SRAM LEF pin names"
        run: |
          set -eux
          echo "=== Preview src/config.json ==="
          cat src/config.json
          echo "=== Patching LEF ==="
          find / -path "*/ihp-sg13g2*" -type f -name '*.lef' 2>/dev/null | while read -r f; do
            echo "Inspecting $f"
            sed -i 's/\bVDDARRAY\b/VDD/g' "$f" || true
            sed -i 's/\bVSSARRAY\b/VSS/g' "$f" || true
          done || true
      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2
  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b
  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b
  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b